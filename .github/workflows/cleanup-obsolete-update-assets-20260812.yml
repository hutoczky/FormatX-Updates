name: One-shot obsolete update asset cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-obsolete-update-assets-20260812.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep current release assets and delete files from older releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          latest_id="$(gh api "repos/$repo/releases/latest" --jq '.id')"
          latest_tag="$(gh api "repos/$repo/releases/latest" --jq '.tag_name')"
          echo "Keeping current release: $latest_tag ($latest_id)"

          deleted=0
          while IFS=$'\t' read -r release_id tag; do
            [[ -n "$release_id" ]] || continue
            if [[ "$release_id" == "$latest_id" ]]; then
              continue
            fi
            while IFS= read -r asset_id; do
              [[ -n "$asset_id" ]] || continue
              echo "Deleting obsolete update asset from $tag: $asset_id"
              gh api --method DELETE "repos/$repo/releases/assets/$asset_id"
              deleted=$((deleted + 1))
            done < <(gh api --paginate "repos/$repo/releases/$release_id/assets?per_page=100" --jq '.[].id')
          done < <(gh api --paginate "repos/$repo/releases?per_page=100" --jq '.[] | [.id,.tag_name] | @tsv')

          echo "Deleted obsolete release assets: $deleted"
          current_assets="$(gh api "repos/$repo/releases/$latest_id/assets?per_page=100" --jq 'length')"
          test "$current_assets" -ge 1
          echo "Current $latest_tag assets retained: $current_assets"
